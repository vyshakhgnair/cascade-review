name: Cascade Review
description: AI code reviewer — SonarQube simulation, blast radius analysis, and smart LLM routing
author: vyshakhgnair

inputs:
  groq_api_key:
    description: Groq API key (free tier available at console.groq.com)
    required: false
  openrouter_api_key:
    description: OpenRouter API key (29 free models)
    required: false
  anthropic_api_key:
    description: Anthropic API key for Claude models
    required: false
  openai_api_key:
    description: OpenAI API key
    required: false
  gemini_api_key:
    description: Google Gemini API key
    required: false
  deepseek_api_key:
    description: DeepSeek API key
    required: false
  provider:
    description: "Model provider to use: groq / openrouter / anthropic / openai / gemini / deepseek"
    required: false
    default: groq
  model:
    description: Model name (defaults to provider's recommended free model)
    required: false
  output_format:
    description: "Output format: terminal / markdown / sarif / json"
    required: false
    default: markdown
  severity_threshold:
    description: "Minimum severity to report: critical / warning / info"
    required: false
    default: warning
  no_llm:
    description: Skip LLM analysis, run static checks only (no API key needed)
    required: false
    default: "false"
  redact:
    description: Strip literals/values from code before sending to LLM (privacy protection)
    required: false
    default: "false"
  severity_gate:
    description: "Fail if findings at or above this severity: critical / high / medium / warning / low"
    required: false
  fail_on_secrets:
    description: Fail the action if secrets are detected
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install cascade-review
      shell: bash
      run: pip install cascade-review

    - name: Run cascade review
      id: run
      shell: bash
      env:
        GROQ_API_KEY: ${{ inputs.groq_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek_api_key }}
      run: |
        OUTPUT=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | \
          cascade \
            --output ${{ inputs.output_format }} \
            ${{ inputs.provider != '' && format('--provider {0}', inputs.provider) || '' }} \
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }} \
            ${{ inputs.no_llm == 'true' && '--no-llm' || '' }} \
            ${{ inputs.redact == 'true' && '--redact' || '' }} \
            ${{ inputs.severity_gate != '' && format('--severity-gate {0}', inputs.severity_gate) || '' }} \
          2>&1) || EXIT_CODE=$?
        echo "$OUTPUT"
        echo "cascade_output<<EOF" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.output_format }}" = "sarif" ]; then
          echo "$OUTPUT" > cascade-results.sarif
        fi
        if [ "${EXIT_CODE:-0}" -eq 3 ]; then
          echo "::error::Severity gate failed — findings exceed threshold"
          exit 3
        fi
        if [ "${EXIT_CODE:-0}" -eq 2 ] && [ "${{ inputs.fail_on_secrets }}" = "true" ]; then
          echo "::error::Secrets detected in diff — review cascade output above"
          exit 2
        fi

    - name: Comment on PR
      if: github.event_name == 'pull_request' && inputs.output_format == 'markdown'
      uses: actions/github-script@v7
      env:
        CASCADE_OUTPUT: ${{ steps.run.outputs.cascade_output }}
      with:
        script: |
          const body = process.env.CASCADE_OUTPUT || '';
          if (body.trim()) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }

    - name: Upload SARIF
      if: inputs.output_format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: cascade-results.sarif
      continue-on-error: true

branding:
  icon: shield
  color: blue
