name: Cascade Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  cascade-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      security-events: write  # needed for SARIF upload

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Option 1: Free cloud review with Groq
      - name: Run Cascade Review
        uses: vyshakhgnair/cascade-review@v1
        with:
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
          output_format: markdown
          fail_on_secrets: true

      # Option 2: Static analysis only (no API key needed)
      # - name: Run Cascade Review (static only)
      #   uses: vyshakhgnair/cascade-review@v1
      #   with:
      #     no_llm: true
      #     output_format: markdown
      #     fail_on_secrets: true

